services:
  - type: web
    name: disteasy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python database/create_tables.py && python seed_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
